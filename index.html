<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b12">
<meta name="description" content="An idle tower defense game that runs in the browser and plays offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Vault Defense</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070b12;
    --panel: #0d1524;
    --panel-2: #131e31;
    --panel-3: #18243b;
    --edge: #22314c;
    --edge-soft: #1a2740;
    --text: #dbe6f6;
    --dim: #8496b3;
    --faint: #5f6f8c;
    --accent: #38bdf8;
    --good: #4ade80;
    --bad: #f43f5e;
    --gold: #fbbf24;
    --core: #c084fc;
    --tap: 44px;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .glyph { display: block; width: 12px; height: 12px; flex: 0 0 auto; }

  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 520px; margin: 0 auto; }

  /* ------------------------------------------------------------- header -- */
  #hud {
    flex: 0 0 auto;
    background: linear-gradient(180deg, #101a2c, #0b1220);
    border-bottom: 1px solid var(--edge);
    padding-top: env(safe-area-inset-top);
  }
  #stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--edge-soft); }
  .stat { position: relative; background: var(--panel); padding: 6px 8px 8px; overflow: hidden; }
  .stat-head { display: flex; align-items: center; gap: 4px; color: var(--dim); }
  .stat-head .k { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; }
  .stat .v {
    display: inline-block; margin-top: 2px;
    font-size: 17px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums;
  }
  .stat .suffix { font-size: 11px; font-weight: 700; color: var(--dim); margin-left: 3px; }
  .tone-gold .stat-head .glyph { color: var(--gold); }
  .tone-accent .stat-head .glyph { color: var(--accent); }
  .tone-good .stat-head .glyph { color: var(--good); }
  .tone-core .stat-head .glyph { color: var(--core); }
  .boss-star { display: none; width: 10px; height: 10px; color: var(--gold); margin-left: 4px; }
  .stat.is-boss .boss-star { display: inline-block; vertical-align: 3px; }
  .stat.is-hurt .v { color: var(--bad); }
  .stat.is-hurt .stat-head .glyph { color: var(--bad); }

  .meter { position: absolute; left: 8px; right: 8px; bottom: 4px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.09); }
  .meter-fill { display: block; width: 100%; height: 100%; border-radius: 2px; background: var(--good); opacity: .8; transform-origin: left center; }
  .is-hurt .meter-fill { background: var(--bad); }

  #wavebar { display: flex; align-items: center; gap: 10px; padding: 5px 10px 6px; background: rgba(0,0,0,.18); }
  #wave-label { display: flex; flex-direction: column; min-width: 0; }
  #wave-name { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
  #wave-note { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #roster { display: flex; gap: 5px; margin-left: auto; overflow: hidden; }
  .foe {
    display: flex; align-items: center; gap: 3px; padding: 1px 6px 1px 2px;
    border: 1px solid var(--edge-soft); border-radius: 999px; background: rgba(255,255,255,.04);
  }
  .foe-art { width: 20px; height: 20px; background-size: contain; background-repeat: no-repeat; background-position: center; }
  .foe-hp { font-size: 9.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .foe.is-boss { border-color: rgba(244,63,94,.45); background: rgba(244,63,94,.12); }
  .foe.is-boss .foe-hp { color: #fca5a5; }
  #wave-track { height: 2px; background: var(--edge-soft); }
  #wave-fill { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); }
  #wave-fill.is-prep { background: var(--faint); }
  #wave-fill.is-boss { background: var(--bad); }

  /* -------------------------------------------------------------- stage -- */
  #stage { position: relative; flex: 1 1 auto; min-height: 30dvh; background: var(--bg); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #toast {
    position: absolute; left: 10px; right: 10px; top: 10px; padding: 10px 12px;
    background: rgba(16,26,44,.96); border: 1px solid var(--edge); border-left: 3px solid var(--accent);
    border-radius: 10px; font-size: 13px; line-height: 1.35;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); display: none;
  }
  #toast.show { display: block; }

  /* ----------------------------------------------------------- controls -- */
  #controls { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--edge); border-top: 1px solid var(--edge); }
  #controls button {
    display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto;
    column-gap: 9px; align-items: center; text-align: left;
    min-height: 48px; padding: 5px 12px; border: 0; background: var(--panel);
  }
  #controls .ico {
    grid-row: 1 / 3; display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 9px; background: rgba(255,255,255,.05); color: var(--dim);
  }
  #controls .ico .glyph { width: 15px; height: 15px; }
  #controls .label { font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  #controls .sub { font-size: 10px; color: var(--dim); }
  #controls button.on .ico { color: var(--accent); background: rgba(56,189,248,.16); }
  #controls button.on .label { color: var(--accent); }
  #controls button:active { background: var(--panel-2); }

  /* --------------------------------------------------------------- tabs -- */
  #tabs { flex: 0 0 auto; display: flex; background: var(--panel); border-top: 1px solid var(--edge); }
  #tabs button {
    flex: 1; min-height: var(--tap); display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; background: none; color: var(--dim); font-weight: 600; letter-spacing: .03em;
    border-bottom: 2px solid transparent;
  }
  #tabs .glyph { width: 14px; height: 14px; }
  #tabs button[aria-selected="true"] {
    color: var(--text); border-bottom-color: var(--accent);
    background: linear-gradient(180deg, rgba(56,189,248,.12), transparent);
  }

  /* -------------------------------------------------------------- panel -- */
  #panel {
    flex: 0 1 auto; height: 226px; min-height: 88px; background: var(--panel);
    padding: 9px 9px calc(10px + env(safe-area-inset-bottom));
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  @media (max-height: 720px) { #panel { height: 190px; } }
  /* Landscape on a phone. Portrait is the design; this only keeps it usable. */
  @media (max-height: 520px) {
    #panel { height: 132px; }
    #controls button { min-height: var(--tap); }
    #controls .sub { display: none; }
    #wavebar { padding-top: 3px; padding-bottom: 3px; }
  }

  .hint { margin: 0 2px 8px; color: var(--dim); font-size: 11.5px; line-height: 1.4; }

  .card {
    position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 11px 8px 12px; overflow: hidden; text-align: left;
    background: linear-gradient(180deg, var(--panel-2), var(--panel-3));
    border: 1px solid var(--edge); border-radius: var(--radius);
  }
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--tint, transparent);
  }
  .row { min-height: var(--tap); }
  .card + .card, .card + .row, .row + .card, .row + .row { margin-top: 6px; }
  .card:active { background: var(--panel-3); }
  .card.poor { opacity: .74; }
  .card:disabled { opacity: .5; }
  .card.on { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(56,189,248,.3), 0 0 20px rgba(56,189,248,.1); }
  .row.drag { touch-action: none; }
  .row.dragging { opacity: .45; border-color: var(--accent); }

  .tile {
    width: 46px; height: 46px; flex: 0 0 auto; border-radius: 10px;
    background-color: rgba(6,10,18,.55); background-size: contain;
    background-repeat: no-repeat; background-position: center;
    border: 1px solid var(--edge-soft); box-shadow: inset 0 0 14px rgba(0,0,0,.55);
  }
  .glyph-tile { display: flex; align-items: center; justify-content: center; color: var(--accent); }
  .glyph-tile .glyph { width: 22px; height: 22px; }
  .glyph-tile.core { color: var(--core); }

  .body { flex: 1 1 auto; min-width: 0; }
  .headline { display: flex; align-items: baseline; gap: 6px; }
  .name { font-size: 14px; font-weight: 700; }
  .name.big { font-size: 21px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .badge {
    font-size: 9.5px; font-weight: 700; letter-spacing: .05em; color: var(--dim);
    background: rgba(255,255,255,.07); border-radius: 999px; padding: 1px 6px; white-space: nowrap;
  }
  .badge.live { color: var(--accent); background: rgba(56,189,248,.14); text-transform: uppercase; }
  .sub { margin-top: 1px; font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 5px; }
  .chip { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .chip .glyph { width: 11px; height: 11px; color: var(--faint); }
  .chip b { font-weight: 700; color: #b9c8de; }
  .chip .k { text-transform: uppercase; letter-spacing: .07em; font-size: 9px; color: var(--faint); }
  .chip.next b { color: var(--good); }

  .buy { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .cost { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cost .glyph { width: 12px; height: 12px; color: var(--gold); }
  .cost.no, .cost.no .glyph { color: var(--bad); }
  .micro { font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }

  .selection { display: block; margin-bottom: 8px; }
  .card.selected { border-color: rgba(56,189,248,.4); }
  .sell {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 0 12px;
    background: rgba(244,63,94,.09); border: 1px solid rgba(244,63,94,.35);
    border-radius: var(--radius); color: #fca5a5; font-weight: 700;
  }
  .sell .glyph { width: 15px; height: 15px; }
  .sell .refund { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--good); }
  .sell:active { background: rgba(244,63,94,.16); }

  .meter.wide { position: static; margin-top: 7px; height: 4px; background: rgba(255,255,255,.12); }
  .meter-fill.core { background: var(--core); }
  .meter-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .hero .sub, .action .sub { white-space: normal; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
  .mini { padding: 6px 9px 7px; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 10px; }
  .mini-head { display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; }
  .mini-head .glyph { width: 11px; height: 11px; color: var(--faint); }
  .mini b { display: block; margin-top: 2px; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }

  .split { display: flex; gap: 6px; margin-top: 8px; }
  .toggle {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    padding: 6px 4px; background: var(--panel-2); border: 1px solid var(--edge); border-radius: var(--radius);
  }
  .toggle .ico { display: flex; color: var(--accent); }
  .toggle .glyph { width: 18px; height: 18px; }
  .toggle .label { font-size: 11px; font-weight: 700; }
  .toggle.off .ico { color: var(--faint); }
  .toggle:disabled { opacity: .45; }
  .toggle.danger { color: #fca5a5; border-color: #4c1d2b; background: rgba(244,63,94,.06); }
  .toggle.danger .ico { color: #fca5a5; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <header id="hud">
    <div id="stats"></div>
    <div id="wavebar">
      <div id="wave-label">
        <b id="wave-name">Wave 1</b>
        <span id="wave-note">starting</span>
      </div>
      <div id="roster"></div>
    </div>
    <div id="wave-track"><i id="wave-fill"></i></div>
  </header>

  <div id="stage">
    <canvas id="game" aria-label="Play field"></canvas>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <div id="controls">
    <button id="btn-pause" type="button" aria-pressed="false">
      <i class="ico"></i><span class="label">Pause</span><span class="sub">stop the clock</span>
    </button>
    <button id="btn-speed" type="button">
      <i class="ico"></i><span class="label">1×</span><span class="sub">game speed</span>
    </button>
  </div>

  <nav id="tabs" role="tablist" aria-label="Panels">
    <button id="tab-build" role="tab" type="button" data-tab="build" data-icon="build" aria-controls="panel" aria-selected="true">Build</button>
    <button id="tab-upgrade" role="tab" type="button" data-tab="upgrade" data-icon="upgrade" aria-controls="panel" aria-selected="false">Upgrade</button>
    <button id="tab-prestige" role="tab" type="button" data-tab="prestige" data-icon="core" aria-controls="panel" aria-selected="false">Prestige</button>
  </nav>
  <section id="panel" role="tabpanel" aria-labelledby="tab-build" tabindex="0"></section>
</div>

<script type="module">
import { createGame, createSystemClock, createManualClock, LEVEL } from './game.js';
import { BALANCE } from './balance.js';
import { createRenderer } from './render.js';
import { createAudio } from './audio.js';
import { createUI } from './ui.js';
import { glyph } from './icons.js';
import { formatNumber, formatDuration } from './format.js';

// ------------------------------------------------------------------ audio --
// Created lazily on the first gesture; see audio.js.
const audio = createAudio({
  getState: () => ({
    muted: game.state.muted,
    musicOff: game.state.musicOff,
    wave: game.state.wave,
    boss: game.isBossWave(game.state.wave),
  }),
});

// ------------------------------------------------------------------ toast --
let toastTimer = 0;
const toastEl = document.getElementById('toast');
function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
}

// ------------------------------------------------------------------- game --
// Tests replace the clock so they can fast-forward without waiting.
const clock = globalThis.__TD_MANUAL_CLOCK ? createManualClock(Date.now()) : createSystemClock();
const game = createGame({
  clock,
  onEvent(ev) {
    switch (ev.type) {
      case 'shot': audio.shot(ev.tower); break;
      case 'kill': audio.play('kill', ev.boss); break;
      case 'leak': audio.play('leak'); break;
      case 'waveStart': audio.play('waveStart', ev.boss); break;
      case 'waveClear': audio.play('waveClear'); break;
      case 'breach': audio.play('breach'); break;
      case 'prestige': audio.play('prestige'); break;
      case 'build': audio.play('build'); break;
      default: break;
    }
  },
});

const canvas = document.getElementById('game');
const renderer = createRenderer(canvas);

const loadReport = game.load();
if (loadReport.offline) {
  showToast(`Offline for ${formatDuration(loadReport.offline.seconds)} — collected ${formatNumber(loadReport.offline.credits)} credits.`);
}

// ------------------------------------------------------------------ input --
canvas.addEventListener('pointerdown', (ev) => {
  audio.unlock();
  const { x, y } = renderer.toLogical(ev.clientX, ev.clientY);
  const hit = game.tapAt(x, y);
  if (hit.kind === 'place' && !hit.ok) { audio.play('deny'); showToast(hit.reason); }
  ui.sync();
}, { passive: true });

// Drag a tower out of the build panel and onto the map. Pointer capture keeps
// the events coming to the card even once the finger is over the canvas.
function makeDraggable(el, type) {
  el.classList.add('drag');
  el.addEventListener('pointerdown', (ev) => {
    if (el.disabled) return;
    audio.unlock();
    el.setPointerCapture(ev.pointerId);
    el.classList.add('dragging');
    game.startDrag(type);
    const p = renderer.toLogical(ev.clientX, ev.clientY);
    game.moveDrag(p.x, p.y);
  });
  el.addEventListener('pointermove', (ev) => {
    if (!game.state.drag) return;
    ev.preventDefault();
    const p = renderer.toLogical(ev.clientX, ev.clientY);
    game.moveDrag(p.x, p.y);
  });
  el.addEventListener('pointerup', (ev) => {
    el.classList.remove('dragging');
    if (!game.state.drag) return;
    if (el.hasPointerCapture?.(ev.pointerId)) el.releasePointerCapture(ev.pointerId);
    const res = game.dropDrag();
    if (!res.ok && res.reason && res.reason !== 'cancelled') { audio.play('deny'); showToast(res.reason); }
    ui.sync();
  });
  el.addEventListener('pointercancel', () => { el.classList.remove('dragging'); game.cancelDrag(); });
}

// --------------------------------------------------------------------- ui --
const ui = createUI({ game, audio, toast: showToast, makeDraggable });

const tabs = document.getElementById('tabs');
for (const btn of tabs.querySelectorAll('button[data-icon]')) {
  btn.prepend(glyph(btn.dataset.icon));
}
tabs.addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-tab]');
  if (btn) { audio.unlock(); ui.setTab(btn.dataset.tab); }
});

document.getElementById('btn-pause').addEventListener('click', () => {
  audio.unlock();
  game.togglePause();
  audio.play(game.state.paused ? 'sell' : 'build');
  ui.sync();
});
document.getElementById('btn-speed').addEventListener('click', () => {
  audio.unlock();
  game.cycleSpeed();
  audio.play('upgrade');
  game.save();
  ui.sync();
});

// ------------------------------------------------------------------- loop --
function frame() {
  game.tickRealtime();
  renderer.draw(game);
  ui.sync();
  requestAnimationFrame(frame);
}

addEventListener('resize', () => renderer.resize());
addEventListener('visibilitychange', () => {
  if (document.hidden) { game.save(); audio.suspend(); } else { audio.resume(); }
});
addEventListener('pagehide', () => game.save());

ui.setTab('build');
renderer.resize();
requestAnimationFrame(frame);

// Offline play and home-screen install. Needs a secure origin, so it is a
// no-op over plain http on a LAN address — the game still runs, just online.
if ('serviceWorker' in navigator && globalThis.isSecureContext) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch((err) => console.warn('service worker not registered', err));
  });
}

// Test surface. Kept tiny and read-only apart from the clock.
globalThis.__td = {
  game, renderer, clock, audio, ui, BALANCE, LEVEL, formatNumber,
  setTab: (t) => ui.setTab(t),
  renderPanel: () => { ui.rebuild(); ui.sync(); },
};
</script>
