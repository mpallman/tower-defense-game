<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Vault Defense</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070b12;
    --panel: #0d1524;
    --panel-2: #131e31;
    --edge: #22314c;
    --text: #dbe6f6;
    --dim: #8496b3;
    --accent: #38bdf8;
    --good: #4ade80;
    --bad: #f43f5e;
    --tap: 44px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 520px; margin: 0 auto; }

  #hud {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--edge); border-bottom: 1px solid var(--edge);
    padding-top: env(safe-area-inset-top);
  }
  #hud div { background: var(--panel); padding: 6px 4px; text-align: center; }
  #hud span { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #hud b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; background: var(--bg); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #toast {
    position: absolute; left: 8px; right: 8px; top: 8px; padding: 10px 12px;
    background: rgba(19,30,49,.95); border: 1px solid var(--edge); border-radius: 10px;
    font-size: 13px; display: none;
  }
  #toast.show { display: block; }

  #tabs { display: flex; border-top: 1px solid var(--edge); background: var(--panel); }
  #tabs button {
    flex: 1; min-height: var(--tap); border: 0; background: none; color: var(--dim);
    font: inherit; font-weight: 600; letter-spacing: .04em; border-bottom: 2px solid transparent;
  }
  #tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); background: var(--panel-2); }

  #panel {
    background: var(--panel); padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    height: 200px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .row {
    display: flex; align-items: center; gap: 8px; width: 100%;
    min-height: var(--tap); margin-bottom: 6px; padding: 6px 10px;
    background: var(--panel-2); border: 1px solid var(--edge); border-radius: 10px;
    color: var(--text); font: inherit; text-align: left;
  }
  .row:disabled { opacity: .45; }
  .row.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px rgba(56,189,248,.35); }
  .row .name { font-weight: 700; }
  .row .sub { font-size: 11px; color: var(--dim); }
  .row .grow { flex: 1 1 auto; min-width: 0; }
  .row .cost { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .cost.no { color: var(--bad); }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .hint { color: var(--dim); font-size: 12px; padding: 2px 4px 8px; }
  .split { display: flex; gap: 6px; }
  .split .row { margin-bottom: 0; justify-content: center; }
  .danger { border-color: #4c1d2b; color: #fca5a5; }
</style>

<div id="app">
  <header id="hud">
    <div><span>Credits</span><b id="hud-credits">0</b></div>
    <div><span>Wave</span><b id="hud-wave">1</b></div>
    <div><span>Vault</span><b id="hud-vault">20</b></div>
    <div><span>Cores</span><b id="hud-cores">0</b></div>
  </header>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="toast"></div>
  </div>

  <nav id="tabs">
    <button data-tab="build" aria-selected="true">Build</button>
    <button data-tab="upgrade" aria-selected="false">Upgrade</button>
    <button data-tab="prestige" aria-selected="false">Prestige</button>
  </nav>
  <section id="panel"></section>
</div>

<script type="module">
import { BALANCE } from './balance.js';
import { createGame, createSystemClock, createManualClock, LEVEL } from './game.js';
import { createRenderer } from './render.js';
import { formatNumber, formatDuration } from './format.js';

// ------------------------------------------------------------------ audio --
// Synthesised only, and only after the first user gesture.
const audio = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx && typeof AudioContext !== 'undefined') ctx = new AudioContext();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function blip(freq, duration, type = 'square', gain = 0.04) {
    if (!ctx || game.state.muted) return;
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.5), ctx.currentTime + duration);
    amp.gain.setValueAtTime(gain, ctx.currentTime);
    amp.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(amp).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }
  return { ensure, blip };
})();

// ------------------------------------------------------------------ toast --
let toastTimer = 0;
const toastEl = document.getElementById('toast');
function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
}

// ------------------------------------------------------------------- game --
// Tests replace the clock so they can fast-forward without waiting.
const clock = globalThis.__TD_MANUAL_CLOCK ? createManualClock(Date.now()) : createSystemClock();
const game = createGame({
  clock,
  onEvent(ev) {
    if (ev.type === 'breach') audio.blip(90, 0.5, 'sawtooth', 0.07);
    else if (ev.type === 'waveClear') audio.blip(520, 0.12, 'triangle', 0.03);
    else if (ev.type === 'prestige') audio.blip(660, 0.4, 'triangle', 0.05);
  },
});

const canvas = document.getElementById('game');
const renderer = createRenderer(canvas);

const loadReport = game.load();
if (loadReport.offline) {
  showToast(`Offline for ${formatDuration(loadReport.offline.seconds)} — collected ${formatNumber(loadReport.offline.credits)} credits.`);
}

// ------------------------------------------------------------------ input --
canvas.addEventListener('pointerdown', (ev) => {
  audio.ensure();
  const { x, y } = renderer.toLogical(ev.clientX, ev.clientY);
  const hit = game.tapAt(x, y);
  if (hit.kind === 'enemy') audio.blip(320, 0.06, 'square', 0.025);
  if (hit.kind === 'slot' && hit.slot >= 0) {
    if (game.state.buildType && game.slotIsFree(hit.slot)) tryBuild(hit.slot, game.state.buildType);
    setTab('build');
  }
  renderPanel();
}, { passive: true });

function tryBuild(slot, type) {
  const res = game.buildTower(slot, type);
  if (res.ok) {
    audio.blip(220, 0.1, 'square', 0.04);
    game.state.selectedSlot = -1;
    game.state.buildType = null;
  } else {
    showToast(res.reason);
  }
  return res;
}

// -------------------------------------------------------------------- ui ---
const panel = document.getElementById('panel');
const tabs = document.getElementById('tabs');
let tab = 'build';

tabs.addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-tab]');
  if (btn) { audio.ensure(); setTab(btn.dataset.tab); }
});

function setTab(next) {
  tab = next;
  for (const btn of tabs.querySelectorAll('button')) {
    btn.setAttribute('aria-selected', String(btn.dataset.tab === tab));
  }
  renderPanel();
}

function row({ color, name, sub, cost, affordable, on, disabled, onClick, danger }) {
  const el = document.createElement('button');
  el.className = 'row' + (on ? ' on' : '') + (danger ? ' danger' : '');
  el.disabled = !!disabled;
  if (color) {
    const dot = document.createElement('i');
    dot.className = 'dot';
    dot.style.background = color;
    el.appendChild(dot);
  }
  const grow = document.createElement('div');
  grow.className = 'grow';
  grow.innerHTML = `<div class="name"></div><div class="sub"></div>`;
  grow.querySelector('.name').textContent = name;
  grow.querySelector('.sub').textContent = sub || '';
  el.appendChild(grow);
  if (cost != null) {
    const c = document.createElement('div');
    c.className = 'cost' + (affordable ? '' : ' no');
    c.textContent = cost;
    el.appendChild(c);
  }
  if (onClick) el.addEventListener('click', () => { audio.ensure(); onClick(); renderPanel(); });
  return el;
}

function renderPanel() {
  const state = game.state;
  panel.replaceChildren();

  if (tab === 'build') {
    const selected = state.selectedSlot;
    const tower = selected >= 0 ? game.towerAt(selected) : null;

    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = tower
      ? `Slot ${selected + 1}: ${BALANCE.towers[tower.type].name}`
      : selected >= 0
        ? `Slot ${selected + 1} empty — pick a tower.`
        : 'Pick a tower, then tap an empty slot. Tap enemies to damage them.';
    panel.appendChild(hint);

    if (tower) {
      const stats = game.towerStats(tower);
      panel.appendChild(row({
        color: BALANCE.towers[tower.type].color,
        name: BALANCE.towers[tower.type].name,
        sub: `${formatNumber(stats.damage * stats.fireRate)} dps · ${tower.kills} kills`,
      }));
      panel.appendChild(row({
        name: 'Sell tower',
        sub: `refund ${Math.round(BALANCE.economy.sellRefund * 100)}% of what it cost`,
        danger: true,
        onClick: () => {
          const res = game.sellTower(selected);
          if (res.ok) { state.selectedSlot = -1; showToast(`Sold for ${formatNumber(res.refund)}`); }
        },
      }));
    }

    for (const [key, def] of Object.entries(BALANCE.towers)) {
      const cost = game.towerCost(key);
      const stats = game.towerStats({ type: key });
      panel.appendChild(row({
        color: def.color,
        name: def.name,
        sub: `${def.blurb} · ${formatNumber(stats.damage * stats.fireRate)} dps`,
        cost: formatNumber(cost),
        affordable: state.credits >= cost,
        on: state.buildType === key,
        onClick: () => {
          if (selected >= 0 && game.slotIsFree(selected)) { tryBuild(selected, key); return; }
          state.buildType = state.buildType === key ? null : key;
        },
      }));
    }
  }

  if (tab === 'upgrade') {
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = `Applies to every tower. Tap damage ${formatNumber(game.tapDamage())}.`;
    panel.appendChild(hint);
    for (const [key, def] of Object.entries(BALANCE.upgrades)) {
      const cost = game.upgradeCost(key);
      panel.appendChild(row({
        name: `${def.name} · lv ${game.state.upgrades[key]}`,
        sub: `${def.blurb} — now ×${game.upgradeMult(key).toFixed(2)}`,
        cost: formatNumber(cost),
        affordable: state.credits >= cost,
        disabled: state.credits < cost,
        onClick: () => { game.buyUpgrade(key); },
      }));
    }
  }

  if (tab === 'prestige') {
    const pending = game.pendingCores();
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = `Cores multiply damage and income. Now ×${game.prestigeMult().toFixed(2)}. `
      + `Run earned ${formatNumber(state.runEarned)}, lifetime ${formatNumber(state.lifetimeEarned)}.`;
    panel.appendChild(hint);
    panel.appendChild(row({
      name: pending > 0 ? `Prestige for ${pending} core${pending === 1 ? '' : 's'}` : 'Prestige',
      sub: pending > 0
        ? 'Wipes towers, upgrades, credits and waves. Cores are permanent.'
        : `Need ${formatNumber(BALANCE.prestige.divisor)} earned this run for the first core.`,
      disabled: pending < BALANCE.prestige.minCoresToPrestige,
      onClick: () => {
        if (!confirm(`Prestige now for ${pending} core(s)? This wipes the current run.`)) return;
        const res = game.prestige();
        if (res.ok) { setTab('build'); showToast(`+${res.cores} cores`); }
      },
    }));
    panel.appendChild(row({
      name: `Best wave ${state.bestWave}`,
      sub: `${formatNumber(state.kills)} kills · ${state.prestiges} prestiges · ${formatNumber(state.incomeRate)}/s recent income`,
    }));
    const split = document.createElement('div');
    split.className = 'split';
    split.appendChild(row({
      name: state.muted ? 'Sound off' : 'Sound on',
      onClick: () => { state.muted = !state.muted; game.save(); },
    }));
    split.appendChild(row({
      name: 'Wipe save',
      danger: true,
      onClick: () => {
        if (!confirm('Delete all progress? This cannot be undone.')) return;
        game.hardReset();
        setTab('build');
      },
    }));
    panel.appendChild(split);
  }
}

const hudEls = {
  credits: document.getElementById('hud-credits'),
  wave: document.getElementById('hud-wave'),
  vault: document.getElementById('hud-vault'),
  cores: document.getElementById('hud-cores'),
};
function renderHud() {
  hudEls.credits.textContent = formatNumber(game.state.credits);
  hudEls.wave.textContent = game.state.wave + (game.isBossWave(game.state.wave) ? ' ★' : '');
  hudEls.vault.textContent = Math.max(0, Math.ceil(game.state.vaultHp));
  hudEls.cores.textContent = `${game.state.cores} ×${game.prestigeMult().toFixed(2)}`;
}

// ------------------------------------------------------------------- loop --
let uiTimer = 0;
function frame() {
  game.tickRealtime();
  renderer.draw(game);
  renderHud();
  uiTimer += 1;
  if (uiTimer % 20 === 0) renderPanel();
  requestAnimationFrame(frame);
}

addEventListener('resize', () => renderer.resize());
addEventListener('visibilitychange', () => { if (document.hidden) game.save(); });
addEventListener('pagehide', () => game.save());

setTab('build');
renderHud();
renderer.resize();
requestAnimationFrame(frame);

// Offline play and home-screen install. Needs a secure origin, so it is a
// no-op over plain http on a LAN address — the game still runs, just online.
if ('serviceWorker' in navigator && globalThis.isSecureContext) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch((err) => console.warn('service worker not registered', err));
  });
}

// Test surface. Kept tiny and read-only apart from the clock.
globalThis.__td = { game, renderer, clock, BALANCE, LEVEL, setTab, renderPanel, formatNumber };
</script>
